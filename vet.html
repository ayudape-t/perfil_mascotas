<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <title>Helpet - Registro Veterinario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-center p-4 font-sans">
  <main class="bg-slate-50 rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden my-6">
    <div class="bg-gradient-to-r from-amber-700 to-amber-800 p-5 text-center text-white">
      <h1 class="text-xl font-extrabold"><i class="fa-solid fa-stethoscope mr-1"></i> Registro Veterinario</h1>
      <p class="text-amber-100 text-xs mt-1">Helpet · Historial médico</p>
    </div>

    <div class="p-6 space-y-4">
      <section id="paso-codigo" class="space-y-3">
        <p class="text-xs text-slate-500">Ingresa el código temporal que te dio el dueño de la mascota.</p>
        <input id="codigo" maxlength="7" autocomplete="off" aria-label="Código temporal de la mascota" placeholder="ABC-234"
          class="w-full text-center text-2xl font-mono font-bold tracking-widest uppercase py-3 border-2 border-slate-200 rounded-2xl outline-none focus:border-amber-500 text-slate-800">
        <button id="btn-validar" type="button" onclick="validarCodigo()"
          class="w-full py-3 bg-amber-700 hover:bg-amber-800 text-white font-bold rounded-2xl shadow-lg">Validar código</button>

        <div class="relative my-2 flex items-center">
          <div class="flex-grow border-t border-slate-300"></div>
          <span class="mx-3 text-[10px] font-extrabold text-slate-500 uppercase tracking-widest">¿No tienes código?</span>
          <div class="flex-grow border-t border-slate-300"></div>
        </div>

        <input id="vet-nombre" maxlength="100" aria-label="Tu nombre o veterinaria" placeholder="Tu nombre o veterinaria"
          class="w-full p-2.5 rounded-xl border border-slate-300 text-sm">
        <button id="btn-solicitar" type="button" onclick="solicitarAutorizacion()"
          class="w-full py-2.5 bg-white hover:bg-slate-100 text-slate-700 border-2 border-slate-300 font-bold rounded-2xl text-sm">
          <i class="fa-brands fa-telegram mr-1"></i> Solicitar autorización al dueño
        </button>
      </section>

      <section id="paso-espera" class="hidden text-center space-y-3">
        <i class="fa-solid fa-circle-notch fa-spin text-amber-500 text-2xl"></i>
        <p class="text-sm font-bold text-slate-700">Esperando la respuesta del dueño…</p>
        <p class="text-xs text-slate-500">Le enviamos la solicitud por Telegram. Tiene 10 minutos para responder.</p>
        <button type="button" onclick="cancelarEspera()" class="text-xs text-slate-500 underline">Cancelar</button>
      </section>

      <section id="paso-form" class="hidden space-y-3">
        <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 text-sm text-emerald-900">
          <i class="fa-solid fa-paw mr-1"></i> Paciente: <b id="pac-nombre"></b>
          <span id="pac-raza" class="text-emerald-700"></span>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label for="f-fecha" class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Fecha visita *</label>
            <input type="date" id="f-fecha" class="w-full p-2.5 rounded-xl border border-slate-300 text-xs">
          </div>
          <div>
            <label for="f-proxima" class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Próxima cita</label>
            <input type="date" id="f-proxima" class="w-full p-2.5 rounded-xl border border-slate-300 text-xs">
          </div>
        </div>
        <div>
          <label for="f-vet" class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Veterinaria / Dr. *</label>
          <input id="f-vet" maxlength="150" placeholder="Ej. Vet. San Martín" class="w-full p-2.5 rounded-xl border border-slate-300 text-sm">
        </div>
        <div>
          <label for="f-motivo" class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Motivo / Tipo *</label>
          <input id="f-motivo" maxlength="200" placeholder="Ej. Vacuna Quíntuple" class="w-full p-2.5 rounded-xl border border-slate-300 text-sm">
        </div>
        <div>
          <label for="f-diag" class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Diagnóstico</label>
          <input id="f-diag" maxlength="500" class="w-full p-2.5 rounded-xl border border-slate-300 text-sm">
        </div>
        <div>
          <label for="f-receta" class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Receta / Tratamiento</label>
          <textarea id="f-receta" rows="2" maxlength="1000" class="w-full p-2.5 rounded-xl border border-slate-300 text-sm"></textarea>
        </div>
        <button id="btn-guardar" type="button" onclick="guardarRegistro()"
          class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-2xl shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-floppy-disk"></i> Guardar en historial
        </button>
      </section>

      <p id="msg" class="hidden text-center text-xs font-bold rounded-xl p-2.5"></p>
    </div>
  </main>

  <script>
    const sb = supabase.createClient(
      "https://cjxcqdgtchhtfowreuca.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqeGNxZGd0Y2hodGZvd3JldWNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTA3NTksImV4cCI6MjEwNjI4Njc1OX0.x2Pm3dqIU7fbXhfSU0aQTi1Ve5daNgUMPkP0R3IrP4o"
    );
    const petId = new URLSearchParams(location.search).get('id') || '';
    let codigoOk = '';
    let espera = null; // { timer, id, token, hasta }

    const $ = id => document.getElementById(id);
    const hoy = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    $('f-fecha').value = hoy();
    $('f-fecha').max = hoy();

    const ERRORES = {
      sin_codigo: 'Este paciente no tiene un código activo. Pídele al dueño que genere uno o solicita autorización.',
      incorrecto: 'Código incorrecto.',
      expirado: 'El código venció. Pídele al dueño uno nuevo o solicita autorización.',
      bloqueado: 'Demasiados intentos. Espera 15 minutos.',
      limite: 'Este código ya alcanzó su límite de 5 registros. Pide uno nuevo.',
      datos_invalidos: 'Revisa los datos: fecha (no futura), veterinaria y motivo son obligatorios; la próxima cita no puede ser anterior a la visita.'
    };
    const ERRORES_SOLICITUD = {
      sin_telegram: 'El dueño no tiene Telegram vinculado. Pídele el código directamente.',
      espera: 'Ya enviaste una solicitud hace un momento. Espera un par de minutos.',
      limite: 'Demasiadas solicitudes. Pídele el código directamente al dueño.',
      no_existe: 'No se encontró la placa. Revisa el enlace.',
      datos_invalidos: 'Escribe tu nombre o el de tu veterinaria.'
    };

    function msg(texto, ok) {
      const el = $('msg');
      el.textContent = texto;
      el.className = 'text-center text-xs font-bold rounded-xl p-2.5 ' +
        (ok ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800');
    }

    async function validarCodigo(codigoManual) {
      if (!petId) return msg('Falta el ID de la placa en el enlace (?id=...).', false);
      const cod = (typeof codigoManual === 'string' ? codigoManual : $('codigo').value).trim();
      if (cod.replace(/[^A-Za-z0-9]/g, '').length < 6) return msg('El código tiene 6 caracteres.', false);
      const btn = $('btn-validar'); btn.disabled = true;
      const { data, error } = await sb.rpc('vet_validar_codigo', { p_id: petId, p_codigo: cod });
      btn.disabled = false;
      if (error || !data) return msg('Error de conexión. Intenta de nuevo.', false);
      if (data.estado !== 'ok') return msg(ERRORES[data.estado] || 'No se pudo validar.', false);
      codigoOk = cod;
      $('pac-nombre').textContent = data.mascota || '';
      $('pac-raza').textContent = data.raza ? ' · ' + data.raza : '';
      $('paso-codigo').classList.add('hidden');
      $('paso-espera').classList.add('hidden');
      $('paso-form').classList.remove('hidden');
      $('msg').classList.add('hidden');
    }

    // ---- Solicitar autorización al dueño (llega a su Telegram) ----
    async function solicitarAutorizacion() {
      if (!petId) return msg('Falta el ID de la placa en el enlace (?id=...).', false);
      const nombre = $('vet-nombre').value.trim();
      if (!nombre) return msg(ERRORES_SOLICITUD.datos_invalidos, false);
      $('btn-solicitar').disabled = true;
      const { data, error } = await sb.rpc('solicitar_autorizacion_vet', { p_id: petId, p_vet: nombre });
      $('btn-solicitar').disabled = false;
      if (error || !data) return msg('Error de conexión. Intenta de nuevo.', false);
      if (data.estado !== 'ok') return msg(ERRORES_SOLICITUD[data.estado] || 'No se pudo enviar la solicitud.', false);

      $('f-vet').value = nombre;
      espera = { id: data.solicitud, token: data.token, hasta: Date.now() + 10 * 60 * 1000, timer: null };
      $('paso-codigo').classList.add('hidden');
      $('paso-espera').classList.remove('hidden');
      $('msg').classList.add('hidden');
      consultarSolicitud();
    }

    // Consulta cada 5 s, solo mientras se espera la respuesta (máx. 10 min)
    async function consultarSolicitud() {
      if (!espera) return;
      const { data } = await sb.rpc('estado_solicitud_vet', { p_id: espera.id, p_token: espera.token });
      const estado = data && data.estado;
      if (estado === 'aceptada' && data.codigo) { terminarEspera(); return validarCodigo(data.codigo); }
      if (estado === 'rechazada') { terminarEspera(true); return msg('El dueño rechazó la solicitud.', false); }
      if (estado === 'expirada' || estado === 'no_existe' || Date.now() > espera.hasta) {
        terminarEspera(true); return msg('La solicitud venció sin respuesta. Puedes enviarla de nuevo.', false);
      }
      espera.timer = setTimeout(consultarSolicitud, 5000);
    }
    function terminarEspera(volver) {
      if (espera && espera.timer) clearTimeout(espera.timer);
      espera = null;
      if (volver) { $('paso-espera').classList.add('hidden'); $('paso-codigo').classList.remove('hidden'); }
    }
    function cancelarEspera() { terminarEspera(true); $('msg').classList.add('hidden'); }

    async function guardarRegistro() {
      const btn = $('btn-guardar'); btn.disabled = true;
      const v = id => $(id).value.trim() || null;
      const { data, error } = await sb.rpc('vet_agregar_registro', {
        p_id: petId, p_codigo: codigoOk,
        p_fecha: v('f-fecha'), p_vet: $('f-vet').value.trim(), p_motivo: $('f-motivo').value.trim(),
        p_diagnostico: v('f-diag'), p_receta: v('f-receta'), p_proxima: v('f-proxima')
      });
      btn.disabled = false;
      if (error || !data) return msg('Error de conexión. Intenta de nuevo.', false);
      if (data.estado !== 'ok') return msg(ERRORES[data.estado] || 'No se pudo guardar.', false);
      msg(`✅ Registro guardado. Te quedan ${data.restantes} con esta autorización.`, true);
      ['f-motivo', 'f-diag', 'f-receta', 'f-proxima'].forEach(id => $(id).value = '');
    }
  </script>
  <footer class="w-full max-w-sm mx-auto my-4 bg-white/90 rounded-2xl px-4 py-3 text-center text-xs text-slate-700">
    <nav aria-label="Documentos legales" class="flex flex-wrap justify-center gap-x-3 gap-y-1 text-[11px] font-semibold"><a href="privacidad.html" class="text-amber-800 underline">Privacidad y términos</a></nav>
    <p class="mt-2 text-[10px] text-slate-500">© 2026 Helpet</p>
  </footer>
</body>
</html>
