<body class="paw-dark-body min-h-screen flex flex-col items-center justify-center p-4 font-sans relative overflow-x-hidden">

  <main class="shell app">
    <header class="top">
      <img src="logo.png" alt="Helpet" class="top-logo">
      <div class="top-txt">
        <h1>Mis mascotas</h1>
        <p>Toca una para entrar a su panel con su PIN</p>
      </div>
    </header>

    <div class="app-cuerpo">
      <div id="app-lista" class="app-lista"></div>
      <p id="app-vacio" class="app-vacio hidden">Aún no hay mascotas guardadas en este celular. Entra con el código de su placa y aparecerá aquí.</p>

      <form id="app-agregar" class="card card-b" novalidate>
        <label for="app-codigo" class="lbl">Entrar con el código de su placa</label>
        <div class="app-codigo">
          <input id="app-codigo" class="fld" type="text" placeholder="Ej. UJRA59MUPZ" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="300">
          <button type="submit" class="btn-mini">Entrar</button>
        </div>
        <p class="hint">Lo ves en su panel, arriba a la derecha (<i class="fa-solid fa-tag"></i>). También puedes pegar el enlace de su placa.</p>
      </form>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
